name: Build RCA candidate list

on:
  workflow_dispatch:
  push:
    paths:
      - "recruiter.py"
      - ".github/workflows/build-candidate-list.yml"

permissions:
  contents: write

jobs:
  build-list:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build candidate list
        run: python recruiter.py
      - name: Upload candidate list
        uses: actions/upload-artifact@v4
        with:
          name: rca-candidates
          path: rca_candidates.txt
          if-no-files-found: error
          retention-days: 7

      - name: Publish dashboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add candidates.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh RCA candidate data"
            git push
          fi
